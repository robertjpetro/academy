<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <defs>
    <!-- Soft radial gradient for realistic ball curvature -->
    <radialGradient id="ballShading" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
  </defs>

  <!-- Solid white spherical base (guarantees clear visibility on both dark & light tabs) -->
  <circle cx="12" cy="12" r="10" fill="url(#ballShading)" />

  <!-- Authentic curved volleyball seams -->
  <g stroke="#0f172a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 7a16 16 20 0 1 10.98 4.362" />
    <path d="M12 12a13 13 0 0 1-8.66 5" />
    <path d="M16.83 13.634a16 16 0 0 1-9.267 7.328" />
    <path d="M20.66 17A13 13 0 0 0 12 12a13 13 0 0 1 0-10" />
    <path d="M8.17 15.366a16 16 0 0 1-1.713-11.69" />
  </g>

  <!-- Outer perimeter contour -->
  <circle cx="12" cy="12" r="10" fill="none" stroke="#0f172a" stroke-width="1.8" />
</svg>